[package]
name = "monolith-rust"
version = "0.1.0"
description = "Monolith Rust backend"
authors = ["Red Unicorn"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.29", features = ["bundled"] }
keyring = "2.0"
regex = "1.9"
